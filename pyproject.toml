[project]
name = "transport-graphs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "contextily>=1.7.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
